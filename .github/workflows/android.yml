name: Android Debug APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Firebase Android application
        run: python3 tool/configure_firebase_android.py
      - name: Build Firebase-enabled Android debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
