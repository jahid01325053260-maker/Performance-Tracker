name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Configure Firebase Android application
        run: python3 tool/configure_firebase_android.py
      - name: Configure Android in-app updater permission
        run: python3 tool/configure_android_updater.py
      - name: Build Firebase-enabled Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=UPDATE_GITHUB_REPOSITORY=${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      # Debug APKs are deliberately NOT attached to GitHub Releases. The in-app
      # updater only consumes signed production release APKs.
