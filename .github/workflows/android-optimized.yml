name: Android Optimized APK (Small)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing/new GitHub Release tag to attach APKs to (example: V1.3)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android .

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Apply Performance Tracker logo
        run: dart run tool/apply_app_branding.dart android

      - name: Resolve app version for release tag
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
            tag="${INPUT_RELEASE_TAG}"
          fi

          if [[ -n "$tag" ]]; then
            version="${tag#[vV]}"
            version="${version%%+*}"
            version="${version%%-*}"
          else
            version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid app version '$version'. Use a tag such as v1.3.0 or V1.3."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          minor=${minor:-0}
          patch=${patch:-0}
          build_name="$major.$minor.$patch"
          echo "PT_BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "Build version: $build_name"

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Configure existing Firebase Android app
        run: python3 tool/configure_firebase_android.py

      - name: Configure Android in-app updater permission
        run: python3 tool/configure_android_updater.py

      # A tagged release, or a manual run that targets a release tag, must use
      # the same persistent signing certificate as the installed application.
      - name: Require stable signing secrets for installable update releases
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name GitHub Secret is required for installable in-app updates."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          PROPS

          python3 tool/configure_android_release_signing.py

      - name: Build small ABI-specific release APKs
        run: >-
          flutter build apk --release --split-per-abi --tree-shake-icons
          --build-name=$PT_BUILD_NAME
          --build-number=${{ github.run_number }}
          --dart-define=UPDATE_GITHUB_REPOSITORY=${{ github.repository }}

      - name: Prepare clearly named release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release-apks/PerformanceTracker-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            release-apks/PerformanceTracker-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            release-apks/PerformanceTracker-x86_64.apk

          echo 'Prepared APKs:'
          ls -lh release-apks/*.apk

      # Temporary Actions artifacts use the Actions storage quota. Keep this
      # only for manual non-release builds, and never fail the APK build if the
      # quota is full.
      - name: Upload temporary APK artifact for manual non-release builds
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-Optimized-Release-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 1

      # Normal tag push: upload APKs to the release for the pushed tag.
      - name: Attach APKs to pushed tag release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-apks/*.apk

      # Recovery/backfill path: useful when a release (for example V1.3) was
      # created manually or with a tag that an older workflow did not match.
      - name: Attach APKs to manually selected release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: release-apks/*.apk
