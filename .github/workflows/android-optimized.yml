name: Android Optimized APK (Small)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android .
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Configure existing Firebase Android app
        run: python3 tool/configure_firebase_android.py
      - name: Configure Android in-app updater permission
        run: python3 tool/configure_android_updater.py

      # Android only accepts an APK as an update when it is signed with the same
      # certificate as the installed app. Tagged production releases therefore
      # use one persistent keystore stored only in GitHub Secrets.
      - name: Require stable signing secrets for tagged update releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name GitHub Secret is required for installable in-app updates."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          PROPS
          python3 tool/configure_android_release_signing.py

      - name: Build small ABI-specific release APKs
        run: >-
          flutter build apk --release --split-per-abi --tree-shake-icons
          --dart-define=UPDATE_GITHUB_REPOSITORY=${{ github.repository }}
      - name: Show resulting APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-Optimized-Release-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
      - name: Attach signed ABI-specific APKs to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*-release.apk
