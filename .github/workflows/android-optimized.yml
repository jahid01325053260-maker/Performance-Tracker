name: Android Optimized APK (Small)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android .
      - name: Resolve Dart dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Configure existing Firebase Android app
        run: python3 tool/configure_firebase_android.py
      - name: Build small ABI-specific release APKs
        run: flutter build apk --release --split-per-abi --tree-shake-icons
      - name: Show resulting APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-Optimized-Release-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
      - name: Attach ABI-specific APKs to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
