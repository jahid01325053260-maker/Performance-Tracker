name: Desktop Builds
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag to publish/update (example: V1.3 or v1.3.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Required for Flutter Linux and flutter_secure_storage_linux.
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libsecret-1-0
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion libsecret-1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform runner
        run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=${{ matrix.target }} .

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Resolve Windows release version
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = ''
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME.Trim()
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $tag = $env:INPUT_RELEASE_TAG.Trim()
          }

          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            $version = $tag -replace '^[vV]', ''
            $version = ($version -split '[+-]')[0]
          } else {
            $versionLine = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*([^+\s]+)' | Select-Object -First 1
            if ($null -eq $versionLine) { throw 'pubspec.yaml does not contain a valid version.' }
            $version = $versionLine.Matches[0].Groups[1].Value
          }

          if ($version -notmatch '^\d+(\.\d+){0,2}$') {
            throw "Windows build version '$version' is invalid. Use tags such as v1.3.0 or V1.3."
          }
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }
          $buildName = ($parts[0..2] -join '.')

          "WINDOWS_BUILD_NAME=$buildName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows app version: $buildName"
          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "Windows installer will be published to release: $tag"
          }

      # firebase_core 4.15.0 expects Firebase C++ SDK 13.12.0. Its default
      # CMake download uses dl.google.com and may fail on a transient HTTP/2
      # interruption. Download with HTTP/1.1 and retries before CMake starts.
      # Do not commit the downloaded SDK or a Firebase service-account key.
      - name: Download Firebase C++ SDK for Windows (with retries)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = '13.12.0'
          $url = "https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_windows_$version.zip"
          $archive = Join-Path $env:RUNNER_TEMP "firebase_cpp_sdk_windows_$version.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'firebase_cpp_sdk_preinstalled'
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null

          $downloaded = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "Firebase C++ SDK download attempt $attempt/4"
            if (Test-Path $archive) { Remove-Item $archive -Force }
            & curl.exe --http1.1 --fail --location --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1200 --output $archive $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $archive) -and (Get-Item $archive).Length -gt 1048576) {
              $downloaded = $true
              break
            }
            Write-Warning "Download failed or was incomplete; retrying..."
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $downloaded) { throw 'Firebase C++ SDK download failed after retries. Check connectivity to dl.google.com.' }

          & tar.exe -xf $archive -C $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract the Firebase C++ SDK archive.' }
          $sdkDir = Join-Path $sdkRoot 'firebase_cpp_sdk_windows'
          $versionHeader = Join-Path $sdkDir 'include/firebase/version.h'
          if (-not (Test-Path $versionHeader)) { throw "SDK version header was not found: $versionHeader" }
          $header = Get-Content -Raw $versionHeader
          if ($header -notmatch 'FIREBASE_VERSION_MAJOR\s+13\b' -or
              $header -notmatch 'FIREBASE_VERSION_MINOR\s+12\b' -or
              $header -notmatch 'FIREBASE_VERSION_REVISION\s+0\b') {
            throw 'Extracted Firebase SDK version is not 13.12.0.'
          }
          "FIREBASE_CPP_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Firebase C++ SDK prepared at: $sdkDir"

      # Windows only: accept either the legacy one-JSON secret or the five
      # PT_* repository Variables/Secrets. Never require both methods.
      - name: Prepare Windows app connection settings
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          WINDOWS_FIREBASE_OPTIONS_JSON: ${{ secrets.WINDOWS_FIREBASE_OPTIONS_JSON }}
          PT_API_KEY: ${{ vars.PT_API_KEY || secrets.PT_API_KEY }}
          PT_APP_ID: ${{ vars.PT_APP_ID || secrets.PT_APP_ID }}
          PT_MESSAGING_SENDER_ID: ${{ vars.PT_MESSAGING_SENDER_ID || secrets.PT_MESSAGING_SENDER_ID }}
          PT_PROJECT_ID: ${{ vars.PT_PROJECT_ID || secrets.PT_PROJECT_ID }}
          PT_AUTH_DOMAIN: ${{ vars.PT_AUTH_DOMAIN || secrets.PT_AUTH_DOMAIN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $options = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_FIREBASE_OPTIONS_JSON)) {
            try {
              $json = $env:WINDOWS_FIREBASE_OPTIONS_JSON | ConvertFrom-Json -ErrorAction Stop
            } catch {
              throw 'WINDOWS_FIREBASE_OPTIONS_JSON is not valid JSON. Correct it, or remove it and use the five PT_* Variables/Secrets.'
            }
            foreach ($name in @('API_KEY','APP_ID','MESSAGING_SENDER_ID','PROJECT_ID','AUTH_DOMAIN')) {
              $first = $json."FIREBASE_$name"
              $second = $json."PT_$name"
              $options["FIREBASE_$name"] = if (-not [string]::IsNullOrWhiteSpace([string]$first)) { [string]$first } else { [string]$second }
            }
            Write-Host 'Using WINDOWS_FIREBASE_OPTIONS_JSON secret.'
          } else {
            $options = @{
              FIREBASE_API_KEY = $env:PT_API_KEY
              FIREBASE_APP_ID = $env:PT_APP_ID
              FIREBASE_MESSAGING_SENDER_ID = $env:PT_MESSAGING_SENDER_ID
              FIREBASE_PROJECT_ID = $env:PT_PROJECT_ID
              FIREBASE_AUTH_DOMAIN = $env:PT_AUTH_DOMAIN
            }
            Write-Host 'Using PT_* repository Variables/Secrets.'
          }

          $missing = @()
          foreach ($key in @('FIREBASE_API_KEY','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID','FIREBASE_PROJECT_ID','FIREBASE_AUTH_DOMAIN')) {
            $value = [string]$options[$key]
            if ([string]::IsNullOrWhiteSpace($value) -or $value.Contains('REPLACE_') -or $value.Contains('YOUR_')) {
              $missing += $key
            }
          }
          if ($missing.Count -gt 0) {
            throw ("Missing Windows configuration: {0}. Add separate PT_* names under Repository Settings > Secrets and variables > Actions > Variables or Secrets, OR add one WINDOWS_FIREBASE_OPTIONS_JSON repository secret." -f ($missing -join ', '))
          }
          if ($options['FIREBASE_PROJECT_ID'] -ne 'performance-tracker-66b42') {
            throw 'Project mismatch: the Android app uses performance-tracker-66b42. Use the same project for Windows.'
          }
          if ($options['FIREBASE_APP_ID'] -notmatch '^1:[0-9]+:web:') {
            throw 'PT_APP_ID should be the Firebase Web appId (1:...:web:...), not Android mobilesdk_app_id.'
          }
          if ($options['FIREBASE_MESSAGING_SENDER_ID'] -notmatch '^[0-9]+$') {
            throw 'PT_MESSAGING_SENDER_ID must be numeric.'
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE 'firebase_config/windows/firebase_options.local.json'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
          $serialized = $options | ConvertTo-Json -Depth 3 -Compress
          [System.IO.File]::WriteAllText($dest, $serialized, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Windows configuration validated and saved for this build (values are not printed).'

      - name: Build release Windows application with Firebase
        if: matrix.target == 'windows'
        shell: pwsh
        run: >-
          flutter build windows --release
          --build-name=$env:WINDOWS_BUILD_NAME
          --build-number=${{ github.run_number }}
          --dart-define-from-file=firebase_config/windows/firebase_options.local.json
          --dart-define=UPDATE_GITHUB_REPOSITORY=${{ github.repository }}

      - name: Add Windows VC++ runtime DLLs
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            if (Test-Path (Join-Path $releaseDir $dll)) { continue }
            $candidate = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022' -Filter $dll -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Select-Object -First 1
            if ($null -ne $candidate) {
              Copy-Item $candidate.FullName -Destination (Join-Path $releaseDir $dll) -Force
              Write-Host "Bundled $dll"
            } else {
              Write-Warning "$dll was not found on the runner. The target PC may need the Microsoft VC++ Redistributable."
            }
          }

      - name: Build Windows installer EXE
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $versionDefine = '/DAppVersion="' + $env:WINDOWS_BUILD_NAME + '"'
          & $iscc $versionDefine 'windows\installer\performance_tracker.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }

          $installer = Join-Path $env:GITHUB_WORKSPACE 'build/windows/installer/PerformanceTracker-windows-x64-setup.exe'
          if (-not (Test-Path $installer)) { throw "Windows installer was not created: $installer" }

          $portable = Join-Path $env:GITHUB_WORKSPACE 'build/windows/installer/PerformanceTracker-windows-x64-portable.zip'
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $portable -Force
          Write-Host "Windows installer: $installer"
          Write-Host "Windows portable archive: $portable"

      - name: Publish Windows files to GitHub Release
        if: matrix.target == 'windows' && (github.ref_type == 'tag' || inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:WINDOWS_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Release tag was not resolved.' }

          $releaseExists = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
              break
            }
            Start-Sleep -Seconds 5
          }

          if (-not $releaseExists) {
            & gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Performance Tracker $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              # Android and Windows release workflows can run at the same time.
              # If the other workflow created the release first, continue.
              & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
              if ($LASTEXITCODE -ne 0) { throw "Unable to create or find GitHub Release $tag" }
            }
          }

          & gh release upload $tag `
            'build/windows/installer/PerformanceTracker-windows-x64-setup.exe' `
            'build/windows/installer/PerformanceTracker-windows-x64-portable.zip' `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload Windows release assets.' }

      - name: Build release Linux or macOS application
        if: matrix.target != 'windows'
        run: >-
          flutter build ${{ matrix.target }} --release
          --dart-define=UPDATE_GITHUB_REPOSITORY=${{ github.repository }}

      - name: Upload desktop build artifact (manual non-release runs only)
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PerformanceTracker-${{ matrix.target }}
          retention-days: 1
          path: |
            build/windows/installer/PerformanceTracker-windows-x64-setup.exe
            build/windows/installer/PerformanceTracker-windows-x64-portable.zip
            build/linux/x64/release/bundle/**
            build/macos/Build/Products/Release/*.app/**
          if-no-files-found: error
