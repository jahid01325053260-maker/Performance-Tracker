name: Analyze and Test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name performance_tracker_flutter --org com.performance --platforms=android,ios,linux .
      - run: python3 tool/configure_firebase_android.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
